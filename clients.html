<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VAM — Clients</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

 <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <!-- Header -->
  <header class="header">
    <div class="container header-inner">
       <a class="brand" href="index.html" aria-label="VAM Home">
      
      <span style="font-size:28px;font-weight:900;"> <img src="./assets/VAM logo.png" alt="VAM Logo"/></span>
    </a>

      <button class="nav-toggle" type="button" aria-label="Toggle Menu">
        <span class="hamburger" aria-hidden="true"></span>
      </button>

      <nav class="nav" aria-label="Primary">
        <a href="index.html">Home</a>
        <a href="clients.html">Clients</a>
        <a href="join.html">Join Our Team</a>
        <a href="contact.html">Contact</a>
      </nav>

      <div class="header-cta">
        <a class="btn btn-primary" href="contact.html">
          Get Started <span class="arrow">↗</span>
        </a>
      </div>
    </div>
  </header>

  <main>
    <!-- Clients Hero -->
    <section class="hero hero--clients">
      <div class="container hero-grid">

        <!-- Left -->
        <div>
          <h1 class="clients-title">Clients</h1>

          <a class="btn btn-dark clients-pill" href="https://forms.gle/WcGYNLdYf7W1q3pb9">
            Client Intake Form
          </a>

          <div class="trust-row" style="margin-top:22px;">
            <div class="avatars" aria-label="Trusted avatars">
              <img src="./assets/hero1.avif" alt="" />
              <img src="./assets/hero2.avif" alt="" />
              <img src="./assets/hero3.avif" alt="" />
              <img src="./assets/hero4.avif" alt="" />
            </div>

            <div class="trust-text">
              <span class="pipe">|</span>
              <span>Trusted by 20+ active Businesses</span>
            </div>
          </div>

          <p class="hero-sub" style="margin-top:14px;">
            Serving over 50 Satisfied Professionals
          </p>
        </div>

        <!-- Right -->
        <div class="hero-right">
          <img
            src="./assets/home image1.png"
            alt="Virtual assistant working"
            style="width: 520px; height:auto;"
          />
        </div>

      </div>
   

  </main>

  <section class="testimonials-section" id="testimonials">
  <div class="container">
    <h2 class="testimonials-title">Client Testimonials</h2>

    <div class="testimonial-stage">
      <div class="testimonial-grid" id="testimonialGrid">
        <!-- Cards will be injected by JS -->
      </div>
    </div>

    <div class="testimonial-controls">
      <button class="circle-btn" id="prevTest" aria-label="Previous testimonials">←</button>
      <button class="circle-btn" id="nextTest" aria-label="Next testimonials">→</button>
    </div>
  </div>
</section>


  <footer class="footer">
    <div class="container">© <span id="y"></span> VAM</div>
  </footer>

  <script src="./script.js"></script>
  <script>document.getElementById("y").textContent = new Date().getFullYear();</script>
  <script src="./script.js"></script>

  <!-- Small page-specific style tweaks -->
  <style>
    
  </style>
</body>
</html>
